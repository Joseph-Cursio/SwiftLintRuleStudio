# Rules come from the shared configuration; only this project's paths are here.
# See ../SwiftLintConfig/README.md.
parent_config: ../SwiftLintConfig/.swiftlint.yml

included:
  - App
  - ExplorerApp
  - UI
  - SwiftLintRuleStudioTests
  - SwiftLintRuleStudioUITests
  - SwiftLintRuleStudioCore
  - SwiftLintInProcessBackend

excluded:
  - SwiftLintRuleStudioCore/.build
  - SwiftLintInProcessBackend/.build
  - SwiftLintRuleStudioCore/.swiftpm
  - SwiftLintInProcessBackend/.swiftpm
  # swift-infer's transient verify work dir and its generated regression tests
  # are machine output, not hand-written source.
  - SwiftLintRuleStudioCore/.swiftinfer
  - SwiftLintRuleStudioCore/Tests/Generated
